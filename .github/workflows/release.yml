name: Release

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/snapshot-tool
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token/secret is used.
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Build sdist and wheel
      run: uv build

    - name: Publish to PyPI (trusted publishing)
      run: uv publish --trusted-publishing always
