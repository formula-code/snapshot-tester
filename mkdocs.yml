site_name: snapshot-tool
site_description: Snapshot-testing harness for ASV benchmarks — capture function outputs, verify correctness after optimization.
repo_url: https://github.com/formula-code/snapshot-tester
repo_name: formula-code/snapshot-tester

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

validation:
  links:
    not_found: info

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - CLI (snapshot-tool): guide/cli.md
      - Python API Quickstart: getting-started/quickstart.md
      - Configuration: guide/configuration.md
  - User Guide:
      - Discovery: guide/discovery.md
      - Tracing: guide/tracing.md
      - Comparison: guide/comparison.md
      - Baseline & Verify: guide/baseline-and-verify.md
      - Determinism: guide/determinism.md
      - Snapshot Storage: guide/storage.md
